<footer class="footer">
  <div class="footer__inner">
    <p class="footer__copy">
      {{ site.author.name }} &copy; <span id="year"></span> Designed by
      <a href="https://jamlab.in/" target="_blank" rel="noopener">Just Another Media Laboratory (JAM Lab)</a>
    </p>
    <ul class="footer__socials" aria-label="Social links">
      <li>
        <a href="{{ '/feed.xml' | relative_url }}" class="footer__social-link" target="_blank" rel="noopener" aria-label="RSS Feed" title="RSS Feed">
          <i class="fa-solid fa-rss fa-fw" aria-hidden="true"></i>
        </a>
      </li>
      {% if site.author.linkedin %}
      <li>
        <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" class="footer__social-link" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <i class="fa-brands fa-linkedin-in fa-fw" aria-hidden="true"></i>
        </a>
      </li>
      {% endif %}
      {% if site.author.goodreads %}
      <li>
        <a href="https://www.goodreads.com/{{ site.author.goodreads }}" class="footer__social-link" target="_blank" rel="noopener" aria-label="Goodreads" title="Goodreads">
          <i class="fa-brands fa-goodreads-g fa-fw" aria-hidden="true"></i>
        </a>
      </li>
      {% endif %}
      {% if site.author.email %}
      <li>
        <a href="mailto:{{ site.author.email }}" class="footer__social-link" aria-label="Email" title="Email">
          <i class="fa-solid fa-envelope fa-fw" aria-hidden="true"></i>
        </a>
      </li>
      {% endif %}
    </ul>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</footer>
